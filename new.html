<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Ticket</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">

    <h1>Create Support Ticket</h1>

    <form action="submit_ticket.php" method="POST">

        <div class="form-grid">

            <div class="input-group">
                <label>Full Name</label>
                <input type="text" name="name" required>
            </div>

            <div class="input-group">
                <label>Company</label>
                <input type="text" name="company" required>
            </div>

            <div class="input-group">
                <label>Issue Title</label>
                <input type="text" name="Issue" required>
            </div>

            <div class="input-group">
                <label>Assigned Technician</label>
                <input type="text" name="assigned_to">
            </div>

            <div class="input-group">
                <label>Department</label>
                <input type="text" name="department">
            </div>

            <div class="input-group">
                <label>Issue Reported Via</label>
                <select name="issue_reported_via">
                    <option>Email</option>
                    <option>Phone</option>
                    <option>Walk-In</option>
                    <option>System Alert</option>
                </select>
            </div>

            <div class="input-group">
                <label>Category</label>
                <select name="category">
                    <option>Hardware</option>
                    <option>Software</option>
                    <option>Network</option>
                    <option>Security</option>
                    <option>Production System</option>
                </select>
            </div>

            <div class="input-group">
                <label>Priority</label>
                <select name="priority">
                    <option>Low</option>
                    <option>Medium</option>
                    <option>High</option>
                    <option>Critical</option>
                </select>
            </div>

            <div class="input-group">
                <label>Status</label>
                <select name="status">
                    <option>Open</option>
                    <option>In Progress</option>
                    <option>Closed</option>
                </select>
            </div>

            <div class="input-group">
                <label>Date Reported</label>
                <input type="date" name="date_reported">
            </div>

            <div class="input-group full-width">
                <label>Issue Description</label>
                <textarea name="issue" rows="6" required></textarea>
            </div>

        </div>

        <button type="submit" class="submit-btn">
            Submit Ticket
        </button>

    </form>

</div>

</body>
</html>
